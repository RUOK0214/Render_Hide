name: Build Render Hide 26.2

on:
  push:
    branches: [main, port-26.2]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: gradle
      - name: Test moving piston state publication
        run: python3 scripts/test_moving_piston_states.py
      - name: Test changed-block reveal
        run: python3 scripts/test_changed_block_reveal.py
      - name: Build
        run: |
          chmod +x gradlew
          ./gradlew build --stacktrace
      - name: Read mod version
        id: version
        shell: bash
        run: echo "mod_version=$(sed -n 's/^mod_version=//p' gradle.properties)" >> "$GITHUB_OUTPUT"
      - name: Upload installable JAR
        uses: actions/upload-artifact@v4
        with:
          name: render-hide-26.2-${{ steps.version.outputs.mod_version }}
          path: |
            build/libs/*.jar
            !build/libs/*-sources.jar
          if-no-files-found: error
